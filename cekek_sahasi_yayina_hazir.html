<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marina Çekek Sahası Yerleşim Planı</title>
    <!-- Tailwind CSS (Tasarım için) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>window.MARINA_SUPABASE_URL="https://cxepumcfugqnxixznvir.supabase.co";window.MARINA_SUPABASE_KEY="sb_publishable_80esJnSeEstFkWVztcCgdg_VGXC5yO0";</script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Taşmaları engelle */
            touch-action: none; /* Mobil cihazlarda sayfa kaymasını engelle */
        }

        #map-container {
            background-color: #cbd5e1;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            cursor: crosshair;
        }

        .boat-item {
            position: absolute;
            background-color: #facc15; /* Sarı */
            color: #000000;
            font-weight: 900;
            border: 2px solid #b45309;
            border-radius: 6px;
            cursor: grab;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100px;
            height: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            /* Transform işlemi JS tarafından yönetilecek */
            transform-origin: center center;
            transition: box-shadow 0.2s, border-color 0.2s;
            will-change: transform, left, top;
        }

        .boat-item:active {
            cursor: grabbing;
        }

        .boat-item.selected {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.4);
            z-index: 50 !important;
        }

        /* Arama Bulundu Animasyonu */
        @keyframes pulseHighlight {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); background-color: #facc15; transform: scale(1); }
            50% { box-shadow: 0 0 25px 15px rgba(239, 68, 68, 0); background-color: #ef4444; color: white; border-color: white; transform: scale(1.2); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); background-color: #facc15; transform: scale(1); }
        }

        .highlight-pulse {
            animation: pulseHighlight 0.8s ease-in-out 4;
            z-index: 100 !important;
        }

        /* Özel Range Slider Stili */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }

        /* Kontrol Paneli Görünürlük Geçişi */
        #control-panel {
            transition: opacity 0.2s;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col text-slate-800">

    <header class="bg-slate-900 text-white p-3 flex flex-wrap gap-4 items-center shadow-md z-40 relative">
        <h1 class="text-xl font-bold tracking-wide mr-2">⛵ Saha Planı</h1>
        
        <span id="sync-status" class="text-xs text-amber-200 bg-slate-800 rounded px-2 py-1" title="Ortak kayıt durumu">Yerel kayıt</span>

        <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-white py-2 px-3 rounded-md font-semibold" title="Eski yerleşim yedeğinizi içe aktarın">📂 Yedek İçe Aktar<input type="file" accept=".json,application/json" class="hidden" onchange="importStateBackup(event)"></label>

        <!-- Kroki Yükle -->
        <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white py-2 px-4 rounded-md font-semibold transition-colors flex items-center shadow-sm">
            <span>🖼️ Kroki Yükle</span>
            <input type="file" id="bg-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        </label>

        <div class="h-8 w-px bg-slate-700 hidden md:block"></div>

        <!-- Tekne Ekle -->
        <div class="flex bg-slate-800 p-1 rounded-md border border-slate-700 shadow-inner">
            <input type="text" id="add-boat-input" placeholder="Tekne Adı..." class="bg-slate-900 text-white px-3 py-1 outline-none rounded-l-md w-36 sm:w-48 placeholder-slate-400" onkeydown="handleEnter(event, 'add')">
            <button onclick="addBoat()" class="bg-blue-600 hover:bg-blue-500 px-4 py-1 rounded-r-md font-semibold transition-colors shadow-sm">Ekle</button>
        </div>

        <div class="h-8 w-px bg-slate-700 hidden md:block"></div>

        <!-- Tekne Ara -->
        <div class="flex bg-slate-800 p-1 rounded-md border border-slate-700 shadow-inner">
            <input type="text" id="search-boat-input" placeholder="Tekne Ara..." class="bg-slate-900 text-white px-3 py-1 outline-none rounded-l-md w-36 sm:w-48 placeholder-slate-400" onkeydown="handleEnter(event, 'search')">
            <button onclick="searchBoat()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1 rounded-r-md font-semibold transition-colors shadow-sm">Bul</button>
        </div>

        <!-- Tümünü Temizle -->
        <button onclick="showClearConfirm()" class="ml-auto bg-red-600 hover:bg-red-500 text-white py-2 px-4 rounded-md font-semibold transition-colors shadow-sm flex items-center">
            🗑️ Tümünü Temizle
        </button>
    </header>

    <main class="flex-1 relative w-full h-full" id="map-wrapper">
        <div id="map-container" class="absolute inset-0 w-full h-full">
            <!-- Tekneler JavaScript ile buraya eklenecek -->
        </div>

        <!-- Seçili Tekne Kontrol Paneli (Floating) -->
        <div id="control-panel" class="absolute hidden bg-white rounded-lg shadow-xl border border-slate-200 p-4 w-64 z-[60] flex flex-col gap-4">
            <div class="flex justify-between items-center border-b pb-2">
                <span class="font-bold text-slate-700 truncate" id="panel-boat-name">Tekne Adı</span>
                <button onclick="deselectBoat()" class="text-slate-400 hover:text-slate-700">✖</button>
            </div>
            
            <!-- Tekne adını yalnızca tekneye tıklayarak değiştirme -->
            <div>
                <button id="rename-toggle" onclick="toggleRenameEditor()" class="w-full bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 rounded py-2 font-semibold">✏️ Tekne Adını Düzenle</button>
                <div id="rename-editor" class="hidden mt-2 flex flex-col gap-2">
                    <input id="rename-input" type="text" maxlength="150" class="w-full border border-slate-300 rounded p-2 text-sm" placeholder="Yeni tekne adı" onkeydown="if(event.key === 'Enter') saveBoatName()">
                    <div class="flex gap-2">
                        <button onclick="saveBoatName()" class="flex-1 bg-blue-600 text-white rounded py-1 font-semibold">Kaydet</button>
                        <button onclick="toggleRenameEditor(false)" class="flex-1 bg-slate-100 rounded py-1">Vazgeç</button>
                    </div>
                </div>
            </div>

            <!-- Boyut Kontrolü -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Boyut (Ölçek)</label>
                <div class="flex gap-2">
                    <button onclick="changeScale(-0.1)" class="flex-1 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded py-1 font-bold text-lg text-slate-600 transition">-</button>
                    <button onclick="changeScale(0.1)" class="flex-1 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded py-1 font-bold text-lg text-slate-600 transition">+</button>
                </div>
            </div>

            <!-- Açı Kontrolü (Serbest Döndürme) -->
            <div>
                <div class="flex justify-between mb-1">
                    <label class="text-xs font-semibold text-slate-500">Serbest Döndür</label>
                    <span id="rotation-val" class="text-xs font-bold text-blue-600">0°</span>
                </div>
                <input type="range" id="rotation-slider" min="0" max="360" value="0" oninput="handleRotation(event)" onchange="saveState()">
            </div>

            <hr class="border-slate-100">

            <!-- Sil Butonu -->
            <button onclick="deleteSelectedBoat()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 rounded border border-red-200 transition-colors">
                Sahadan Sil
            </button>
        </div>
    </main>

    <!-- Custom Modal Overlay -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[100] backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform transition-all scale-100">
            <h3 id="modal-title" class="text-lg font-bold text-slate-800 mb-2">Bildirim</h3>
            <p id="modal-msg" class="text-slate-600 mb-6 leading-relaxed">Mesaj buraya gelecek.</p>
            
            <div id="modal-buttons-alert" class="flex justify-end">
                <button onclick="closeModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors w-full">Tamam</button>
            </div>

            <div id="modal-buttons-confirm" class="flex justify-end gap-3 hidden">
                <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2 px-4 rounded-lg transition-colors">İptal</button>
                <button id="modal-confirm-btn" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Evet, Onaylıyorum</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elementleri
        const mapContainer = document.getElementById('map-container');
        const mapWrapper = document.getElementById('map-wrapper');
        const controlPanel = document.getElementById('control-panel');
        const panelBoatName = document.getElementById('panel-boat-name');
        const rotationSlider = document.getElementById('rotation-slider');
        const rotationVal = document.getElementById('rotation-val');
        
        // Uygulama Durumu (State)
        let appState = {
            bgImage: null,
            boats: [] // { id, name, left, top, scale, rotation }
        };

        let selectedBoatId = null;
        let boatIdCounter = Date.now(); // Benzersiz ID'ler için
        let highestZIndex = 10;

        // Modal Yönetimi
        function showMessage(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = message;
            document.getElementById('modal-buttons-alert').classList.remove('hidden');
            document.getElementById('modal-buttons-confirm').classList.add('hidden');
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }

        function showConfirm(title, message, onConfirm) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = message;
            document.getElementById('modal-buttons-alert').classList.add('hidden');
            document.getElementById('modal-buttons-confirm').classList.remove('hidden');
            
            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.onclick = () => {
                onConfirm();
                closeModal();
            };

            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            document.getElementById('custom-modal').classList.remove('flex');
        }

        // --- Ortak veri kaydı (Supabase REST) ve çevrimdışı yerel yedek ---
        const cloudUrl = (window.MARINA_SUPABASE_URL || '').replace(/\/$/, '');
        const cloudKey = window.MARINA_SUPABASE_KEY || '';
        const cloudEnabled = /^https:\/\//.test(cloudUrl) && !cloudUrl.includes('PROJE_KODUNUZ') && !!cloudKey && !cloudKey.startsWith('BURAYA_');
        const syncStatus = document.getElementById('sync-status');
        let confirmedCloudState = null;
        let pendingWrites = Promise.resolve();
        let waitingWrites = 0;
        let cloudLoaded = false;
        let imageUploadInProgress = false;
        let imageUploadFailed = false;
        let cloudWriteFailed = false;
        let syncTimer = null;

        function setSyncStatus(message, isError = false) {
            syncStatus.innerText = message;
            syncStatus.className = 'text-xs rounded px-2 py-1 ' + (isError
                ? 'text-red-100 bg-red-700' : 'text-emerald-100 bg-emerald-800');
        }

        async function apiCall(path, options = {}) {
            const response = await fetch(cloudUrl + '/rest/v1/' + path, {
                ...options,
                headers: {
                    apikey: cloudKey,
                    ...(cloudKey.startsWith('sb_publishable_') ? {} : {Authorization: 'Bearer ' + cloudKey}),
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            if (!response.ok) {
                throw new Error('Bulut HTTP ' + response.status + ': ' + (await response.text()).slice(0, 300));
            }
            if (response.status === 204) return null;
            const body = await response.text();
            return body ? JSON.parse(body) : null;
        }

        // Seri kayıt kuyruğu: henüz sunucuya yazılmamış resmi/tekneyi 4 sn'lik yenileme silemez.
        function queueCloudWrite(task) {
            waitingWrites++;
            setSyncStatus('Kaydediliyor…');
            pendingWrites = pendingWrites.catch(() => {}).then(task).then(() => {
                cloudWriteFailed = false;
                setSyncStatus('● Ortak kayıt aktif');
            }).catch(error => {
                cloudWriteFailed = true;
                console.error('Bulut kayıt hatası:', error);
                setSyncStatus('⚠ Kayıt başarısız — tekrar denenecek', true);
            }).finally(() => { waitingWrites--; });
            return pendingWrites;
        }

        function writeLocalCache() {
            try { localStorage.setItem('marinaState', JSON.stringify(appState)); }
            catch (error) { console.warn('Yerel yedek kaydedilemedi:', error); }
        }

        function snapshotState() { return JSON.parse(JSON.stringify(appState)); }

        function saveState() {
            writeLocalCache();
            if (!cloudEnabled || !cloudLoaded) return;
            // Resim yüklemesi devam ediyorsa mevcut krokiyi asla değiştirme.
            const current = snapshotState();
            queueCloudWrite(async () => {
                const previous = confirmedCloudState || {bgImage: null, boats: []};
                const prevBoats = new Map(previous.boats.map(b => [b.id, b]));
                const nowIds = new Set(current.boats.map(b => b.id));
                const changed = current.boats.filter(b => JSON.stringify(b) !== JSON.stringify(prevBoats.get(b.id)));
                const deleted = previous.boats.filter(b => !nowIds.has(b.id)).map(b => b.id);
                for (const id of deleted) {
                    await apiCall('marina_boats?id=eq.' + encodeURIComponent(id), {method: 'DELETE'});
                }
                if (changed.length) {
                    await apiCall('marina_boats?on_conflict=id', {
                        method: 'POST', headers: {Prefer: 'resolution=merge-duplicates'},
                        body: JSON.stringify(changed.map(b => ({id: b.id, data: b})))
                    });
                }
                if (!imageUploadInProgress && current.bgImage !== previous.bgImage) {
                    await apiCall('marina_settings?on_conflict=id', {
                        method: 'POST', headers: {Prefer: 'resolution=merge-duplicates'},
                        body: JSON.stringify([{id: 1, bg_image: current.bgImage}])
                    });
                }
                // Do not mark a write successful before the server actually acknowledges it.
                confirmedCloudState = {
                    boats: current.boats,
                    bgImage: imageUploadInProgress ? previous.bgImage : current.bgImage
                };
            });
        }

        function redrawState(nextState) {
            const selected = selectedBoatId;
            // UI verisi, son sunucu durumuyla aynı nesneyi paylaşmamalı.
            // Aksi halde tekne eklemek sunucu karşılaştırmasını da değiştirir ve kayıt atlanır.
            appState = JSON.parse(JSON.stringify(nextState));
            mapContainer.style.backgroundImage = appState.bgImage ? `url(${JSON.stringify(appState.bgImage)})` : 'none';
            mapContainer.innerHTML = '';
            appState.boats.forEach(renderBoatElement);
            selectedBoatId = null;
            controlPanel.classList.add('hidden');
            if (selected && appState.boats.some(b => b.id === selected)) selectBoat(selected);
            writeLocalCache();
        }

        async function fetchCloudState() {
            const [boatRows, settingRows] = await Promise.all([
                apiCall('marina_boats?select=id,data'),
                apiCall('marina_settings?select=bg_image&id=eq.1')
            ]);
            return {
                boats: (boatRows || []).map(row => row.data),
                bgImage: settingRows && settingRows.length ? settingRows[0].bg_image : null
            };
        }

        async function loadState() {
            const saved = localStorage.getItem('marinaState');
            let localState = {bgImage: null, boats: []};
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed.boats)) localState = parsed;
                } catch (error) { console.warn('Yerel kayıt bozuk:', error); }
            }
            redrawState(localState);
            if (!cloudEnabled) {
                setSyncStatus('⚠ Yalnızca bu cihazda', true);
                return;
            }
            setSyncStatus('Bağlanıyor…');
            try {
                const remote = await fetchCloudState();
                confirmedCloudState = remote;
                cloudLoaded = true;
                // Boş bulut, halihazırda bulunan krokiyi ve tekneleri silemez.
                // Eski sürümde marinaCloudImported yanlışlıkla işaretlenmiş olsa bile korur.
                if (!remote.boats.length && !remote.bgImage && (localState.boats.length || localState.bgImage)) {
                    redrawState(localState);
                    saveState();
                    await pendingWrites;
                } else {
                    redrawState(remote);
                    setSyncStatus('● Ortak kayıt aktif');
                }
                localStorage.setItem('marinaCloudImported', '1');
                if (syncTimer) clearInterval(syncTimer);
                syncTimer = setInterval(refreshCloudState, 4000);
            } catch (error) {
                console.error('Buluta bağlanılamadı:', error);
                setSyncStatus('⚠ Bağlantı hatası — yerel görünüm korunuyor', true);
                showMessage('Ortak Bağlantı Kurulamadı', 'Kroki ve tekneler cihazda korunuyor, ancak henüz ortak veritabanına bağlanılamadı. ' + error.message);
            }
        }

        async function refreshCloudState() {
            if (!cloudLoaded || waitingWrites || imageUploadInProgress || imageUploadFailed || activeDragEl || !document.getElementById('rename-editor').classList.contains('hidden')) return;
            if (cloudWriteFailed) {
                saveState(); // İnternet yeniden geldiğinde son yerel değişiklikleri gönder.
                return;
            }
            try {
                const remote = await fetchCloudState();
                if (waitingWrites || imageUploadInProgress || activeDragEl) return;
                if (JSON.stringify(remote) !== JSON.stringify(confirmedCloudState)) {
                    confirmedCloudState = remote;
                    redrawState(remote);
                }
                setSyncStatus('● Ortak kayıt aktif');
            } catch (error) {
                console.error('Ortak senkronizasyon kesildi:', error);
                setSyncStatus('⚠ Bağlantı kesildi — görünüm korunuyor', true);
            }
        }

        function toggleRenameEditor(force) {
            if (!selectedBoatId) return;
            const editor = document.getElementById('rename-editor');
            const open = typeof force === 'boolean' ? force : editor.classList.contains('hidden');
            editor.classList.toggle('hidden', !open);
            if (open) {
                const boat = appState.boats.find(b => b.id === selectedBoatId);
                document.getElementById('rename-input').value = boat ? boat.name : '';
                document.getElementById('rename-input').focus();
            }
            positionControlPanel();
        }

        function saveBoatName() {
            if (!selectedBoatId) return;
            const name = document.getElementById('rename-input').value.trim();
            if (!name) { showMessage('Uyarı', 'Lütfen bir tekne adı girin.'); return; }
            const boat = appState.boats.find(b => b.id === selectedBoatId);
            if (!boat) return;
            boat.name = name;
            const el = document.getElementById(boat.id);
            if (el) el.innerText = name;
            panelBoatName.innerText = name;
            toggleRenameEditor(false);
            saveState();
        }

        async function importStateBackup(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file) return;
            try {
                const parsed = JSON.parse(await file.text());
                if (!parsed || !Array.isArray(parsed.boats) || !parsed.boats.every(b => typeof b.id === 'string' && typeof b.name === 'string' && Number.isFinite(Number(b.left)) && Number.isFinite(Number(b.top)))) throw new Error('Geçersiz yerleşim verisi');
                if (!cloudLoaded) throw new Error('Ortak veritabanına bağlantı kurulmadan aktarma yapılamaz');
                showConfirm('Yedeği Yükle', 'Yedekteki tekneler ortak plana eklenecek. Onaylıyor musunuz?', () => {
                    const incoming = parsed.boats.map(b => ({...b, id: String(b.id)}));
                    const byId = new Map(appState.boats.map(b => [b.id, b]));
                    incoming.forEach(b => byId.set(b.id, b));
                    appState.boats = [...byId.values()];
                    if (typeof parsed.bgImage === 'string' && parsed.bgImage) appState.bgImage = parsed.bgImage;
                    redrawState(appState);
                    saveState();
                });
            } catch(e) { showMessage('İçe Aktarma Hatası', e.message); }
        }

        // --- Arka Plan (Kroki) İşlemleri ---
        // Görsel önce Supabase Storage'a YÜKLENİR, sonra kayıt olarak URL saklanır.
        // Kaydetme tamamlanıncaya kadar ortak yenileme ekrandaki krokiyi silemez.
        async function handleImageUpload(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file) return;
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                showMessage('Dosya Türü', 'Lütfen PNG, JPG veya WEBP resmi seçin.');
                return;
            }
            if (file.size > 10 * 1024 * 1024) {
                showMessage('Resim Çok Büyük', 'Kroki en fazla 10 MB olabilir.');
                return;
            }
            if (!cloudEnabled || !cloudLoaded) {
                showMessage('Bağlantı Bekleniyor', 'Krokiyi kaydetmeden önce üstteki ortak kayıt bağlantısının aktif olmasını bekleyin.');
                return;
            }
            if (imageUploadInProgress) return;
            imageUploadInProgress = true;
            imageUploadFailed = false;
            waitingWrites++;
            const previewUrl = URL.createObjectURL(file);
            mapContainer.style.backgroundImage = `url(${JSON.stringify(previewUrl)})`;
            setSyncStatus('Kroki buluta yükleniyor…');
            try {
                // Önce sıradaki tekne kayıtlarını bitir; resim üzerine eski durum yazılmasın.
                await pendingWrites;
                const ext = file.type === 'image/png' ? 'png' : (file.type === 'image/webp' ? 'webp' : 'jpg');
                const fileName = 'kroki-' + Date.now() + '-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)) + '.' + ext;
                const upload = await fetch(cloudUrl + '/storage/v1/object/marina-croquis/' + fileName, {
                    method: 'POST',
                    headers: {
                        apikey: cloudKey,
                        ...(cloudKey.startsWith('sb_publishable_') ? {} : {Authorization: 'Bearer ' + cloudKey}),
                        'Content-Type': file.type,
                        'cache-control': '3600'
                    },
                    body: file
                });
                if (!upload.ok) throw new Error('Resim yüklenemedi (HTTP ' + upload.status + '): ' + (await upload.text()).slice(0, 200));
                const permanentUrl = cloudUrl + '/storage/v1/object/public/marina-croquis/' + encodeURIComponent(fileName);
                await apiCall('marina_settings?on_conflict=id', {
                    method: 'POST', headers: {Prefer: 'resolution=merge-duplicates'},
                    body: JSON.stringify([{id: 1, bg_image: permanentUrl}])
                });
                appState.bgImage = permanentUrl;
                if (confirmedCloudState) confirmedCloudState.bgImage = permanentUrl;
                writeLocalCache();
                mapContainer.style.backgroundImage = `url(${JSON.stringify(permanentUrl)})`;
                cloudWriteFailed = false;
                imageUploadFailed = false;
                setSyncStatus('● Kroki kalıcı kaydedildi');
            } catch(error) {
                console.error('Kroki kaydetme hatası:', error);
                imageUploadFailed = true;
                setSyncStatus('⚠ Kroki yüklenemedi', true);
                mapContainer.style.backgroundImage = `url(${JSON.stringify(previewUrl)})`;
                showMessage('Kroki Kaydedilemedi', 'Resim ekranda geçici olarak duruyor fakat buluta kaydedilemedi. Yeniden yüklemeniz gerekir. ' + error.message);
            } finally {
                imageUploadInProgress = false;
                waitingWrites--;
                // Blob URL ancak arkaplan kalıcı adrese geçince kaldırılır.
                if (appState.bgImage && appState.bgImage.startsWith('https://')) URL.revokeObjectURL(previewUrl);
            }
        }

        // --- Tümünü Temizle ---
        function showClearConfirm() {
            showConfirm(
                "Tümünü Temizle", 
                "Kroki ve sahadaki tüm tekneler silinecek. Bu işlem geri alınamaz. Emin misiniz?",
                () => {
                    appState = { bgImage: null, boats: [] };
                    mapContainer.style.backgroundImage = 'none';
                    mapContainer.innerHTML = '';
                    deselectBoat();
                    saveState();
                    showMessage("Başarılı", "Saha tamamen temizlendi.");
                }
            );
        }

        // --- Tekne Ekleme İşlemleri ---
        function handleEnter(e, action) {
            if (e.key === 'Enter') {
                if (action === 'add') addBoat();
                if (action === 'search') searchBoat();
            }
        }

        function addBoat() {
            const inputEl = document.getElementById('add-boat-input');
            const boatName = inputEl.value.trim();
            
            if (!boatName) {
                showMessage("Uyarı", "Lütfen bir tekne adı girin.");
                return;
            }

            const newBoat = {
                id: 'boat_' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '_' + Math.random().toString(36).slice(2))),
                name: boatName,
                left: 100,
                top: 100,
                scale: 1.0,
                rotation: 0
            };

            appState.boats.push(newBoat);
            renderBoatElement(newBoat);
            saveState();

            inputEl.value = '';
            // Otomatik seç
            selectBoat(newBoat.id);
        }

        function renderBoatElement(boatData) {
            const boatEl = document.createElement('div');
            boatEl.className = 'boat-item';
            boatEl.id = boatData.id;
            boatEl.innerText = boatData.name;
            
            // Konumlandır ve Boyutlandır
            boatEl.style.left = boatData.left + 'px';
            boatEl.style.top = boatData.top + 'px';
            boatEl.style.transform = `rotate(${boatData.rotation}deg) scale(${boatData.scale})`;
            
            // Olayları ekle
            boatEl.addEventListener('mousedown', startDrag);
            boatEl.addEventListener('touchstart', startDrag, {passive: false});
            
            boatEl.addEventListener('click', function(e) {
                e.stopPropagation(); // Harita tıklamasını engelle
                selectBoat(boatData.id);
            });

            mapContainer.appendChild(boatEl);
        }

        // --- Sürükle - Bırak (Drag & Drop) ---
        let activeDragEl = null;
        let startX = 0, startY = 0;
        let initialLeft = 0, initialTop = 0;
        let isDragging = false;

        function startDrag(e) {
            if (e.target !== this) return;
            e.preventDefault();
            
            activeDragEl = this;
            isDragging = false;
            selectBoat(activeDragEl.id);

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            startX = clientX;
            startY = clientY;
            initialLeft = parseFloat(activeDragEl.style.left) || 0;
            initialTop = parseFloat(activeDragEl.style.top) || 0;

            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchmove', dragMove, {passive: false});
            document.addEventListener('touchend', endDrag);
        }

        function dragMove(e) {
            if (!activeDragEl) return;
            e.preventDefault();
            isDragging = true;
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;

            activeDragEl.style.left = newLeft + 'px';
            activeDragEl.style.top = newTop + 'px';

            positionControlPanel();
        }

        function endDrag(e) {
            if (!activeDragEl) return;
            
            // Sürükleme bittiğinde State'i güncelle ve kaydet
            if (isDragging) {
                const id = activeDragEl.id;
                const boatIndex = appState.boats.findIndex(b => b.id === id);
                if (boatIndex > -1) {
                    appState.boats[boatIndex].left = parseFloat(activeDragEl.style.left);
                    appState.boats[boatIndex].top = parseFloat(activeDragEl.style.top);
                    saveState();
                }
            }
            
            activeDragEl = null;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('touchend', endDrag);
        }

        // --- Seçim ve Kontrol Paneli ---
        function selectBoat(id) {
            if (selectedBoatId) {
                const prevEl = document.getElementById(selectedBoatId);
                if(prevEl) prevEl.classList.remove('selected');
            }
            
            selectedBoatId = id;
            const boatEl = document.getElementById(id);
            if (!boatEl) return;

            highestZIndex++;
            boatEl.style.zIndex = highestZIndex;
            boatEl.classList.add('selected');
            
            const boatData = appState.boats.find(b => b.id === id);
            
            document.getElementById('rename-editor').classList.add('hidden');
            // Paneli Güncelle
            panelBoatName.innerText = boatData.name;
            rotationSlider.value = boatData.rotation;
            rotationVal.innerText = boatData.rotation + '°';

            controlPanel.classList.remove('hidden');
            positionControlPanel();
        }

        function deselectBoat() {
            if (selectedBoatId) {
                const prevEl = document.getElementById(selectedBoatId);
                if(prevEl) prevEl.classList.remove('selected');
                selectedBoatId = null;
            }
            controlPanel.classList.add('hidden');
        }

        // Harita boşluğuna tıklanınca seçimi kaldır
        mapWrapper.addEventListener('click', function(e) {
            if (e.target === mapContainer || e.target === mapWrapper) {
                deselectBoat();
            }
        });

        // Kontrol panelinin panel içindeki tıklamalarla kapanmasını engelle
        controlPanel.addEventListener('click', e => e.stopPropagation());
        controlPanel.addEventListener('mousedown', e => e.stopPropagation());
        controlPanel.addEventListener('touchstart', e => e.stopPropagation());

        function positionControlPanel() {
            if (!selectedBoatId) return;
            const boatEl = document.getElementById(selectedBoatId);
            if(!boatEl) return;

            const rect = boatEl.getBoundingClientRect();
            const wrapperRect = mapWrapper.getBoundingClientRect();
            
            let panelLeft = (rect.right - wrapperRect.left) + 15;
            let panelTop = (rect.top - wrapperRect.top);

            // Ekran dışına taşmayı engelle
            if (panelLeft + 256 > wrapperRect.width) { // 256px w-64'e denk gelir
                panelLeft = (rect.left - wrapperRect.left) - 256 - 15;
            }
            if (panelTop + controlPanel.offsetHeight > wrapperRect.height) {
                panelTop = wrapperRect.height - controlPanel.offsetHeight - 15;
            }

            controlPanel.style.left = panelLeft + 'px';
            controlPanel.style.top = panelTop + 'px';
        }

        // --- Boyutlandırma ---
        function changeScale(delta) {
            if (!selectedBoatId) return;
            const boatIndex = appState.boats.findIndex(b => b.id === selectedBoatId);
            if (boatIndex === -1) return;

            let currentScale = appState.boats[boatIndex].scale;
            let newScale = currentScale + delta;
            
            // Limitler
            if (newScale < 0.4) newScale = 0.4;
            if (newScale > 3.0) newScale = 3.0;

            appState.boats[boatIndex].scale = newScale;
            updateBoatTransform(appState.boats[boatIndex]);
            saveState();
        }

        // --- Serbest Döndürme ---
        function handleRotation(e) {
            if (!selectedBoatId) return;
            const boatIndex = appState.boats.findIndex(b => b.id === selectedBoatId);
            if (boatIndex === -1) return;

            const newRot = parseInt(e.target.value);
            rotationVal.innerText = newRot + '°';
            
            appState.boats[boatIndex].rotation = newRot;
            updateBoatTransform(appState.boats[boatIndex]);
            // Not: saveState() onchange eventinde (kaydırma bitince) tetikleniyor.
        }

        function updateBoatTransform(boatData) {
            const boatEl = document.getElementById(boatData.id);
            if(boatEl) {
                boatEl.style.transform = `rotate(${boatData.rotation}deg) scale(${boatData.scale})`;
                positionControlPanel();
            }
        }

        // --- Silme İşlemi ---
        function deleteSelectedBoat() {
            if (!selectedBoatId) return;
            const boatData = appState.boats.find(b => b.id === selectedBoatId);
            
            showConfirm(
                "Tekneyi Sil", 
                `'${boatData.name}' isimli tekneyi sahadan silmek istediğinize emin misiniz?`, 
                () => {
                    // DOM'dan kaldır
                    const boatEl = document.getElementById(selectedBoatId);
                    if(boatEl) boatEl.remove();
                    
                    // State'den kaldır
                    appState.boats = appState.boats.filter(b => b.id !== selectedBoatId);
                    saveState();
                    
                    deselectBoat();
                }
            );
        }

        // --- Arama ---
        function searchBoat() {
            const searchStr = document.getElementById('search-boat-input').value.toLowerCase().trim();
            if (!searchStr) return;

            let found = false;

            appState.boats.forEach(boatData => {
                const boatEl = document.getElementById(boatData.id);
                if (!boatEl) return;

                // Animasyonu sıfırla
                boatEl.classList.remove('highlight-pulse');
                void boatEl.offsetWidth; // Reflow zorla

                if (boatData.name.toLowerCase().includes(searchStr)) {
                    boatEl.classList.add('highlight-pulse');
                    found = true;
                    // Ekranda odaklan
                    boatEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                }
            });

            if (!found) {
                showMessage("Bulunamadı", `Sahada '${searchStr}' aramasına uygun bir tekne bulunamadı.`);
            }
        }

        // Sayfa yüklendiğinde verileri çağır
        window.onload = function() {
            loadState();
        };

    </script>
</body>
</html>
